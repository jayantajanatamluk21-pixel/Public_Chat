<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075e54"><title>BYTECHAT</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{color-scheme:dark;--bg:#0b141a;--panel:#111b21;--panel2:#202c33;--line:#2a3942;--text:#e9edef;--muted:#8696a0;--green:#00a884;--green2:#075e54}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--green);color:#062b25;font-weight:650}button.secondary{background:var(--panel2);color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}input,textarea{background:#2a3942;border:1px solid #3c4b54;color:var(--text);padding:11px;border-radius:9px;width:100%;outline:none}input:focus,textarea:focus{border-color:var(--green)}.hidden{display:none!important}.auth{max-width:430px;margin:8vh auto;padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:46px;height:46px;border-radius:15px;background:var(--green2);display:grid;place-items:center;font-weight:900;font-size:22px}.muted{color:var(--muted)}.stack{display:grid;gap:12px}.authswitch{text-align:center;margin-top:16px}.app{height:100dvh;display:grid;grid-template-columns:340px 1fr;max-width:1500px;margin:auto;background:var(--panel)}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.topbar{padding:15px;display:flex;align-items:center;justify-content:space-between;background:var(--panel2);gap:8px}.userline{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800;flex-shrink:0}.tools{display:flex;gap:6px}.search{padding:10px}.rooms{overflow:auto;flex:1}.room{display:flex;align-items:center;gap:12px;padding:13px;cursor:pointer;border-bottom:1px solid #202b31}.room:hover,.room.active{background:#2a3942}.roominfo{min-width:0;flex:1}.roomname{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.main{display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at center,#15242b,#0b141a 85%)}.chathead{padding:12px 16px;background:var(--panel2);display:flex;align-items:center;justify-content:space-between;gap:10px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:min(75%,620px);padding:9px 12px;border-radius:10px;background:#202c33;overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start}.bubble.mine{background:#005c4b;align-self:flex-end}.byline{font-size:11px;color:#b6d9d0;margin-bottom:4px}.time{font-size:10px;color:#b4c4c9;text-align:right;margin-top:4px}.composer{padding:12px;display:flex;gap:8px;align-items:center;background:var(--panel2)}.composer input{flex:1;min-width:0}.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}.statusbar{padding:12px;display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line)}.pill{background:var(--panel2);color:var(--text);white-space:nowrap}.statusitem{font-size:12px;min-width:95px;text-align:center}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:16px;width:min(440px,100%);display:grid;gap:12px;max-height:85dvh;overflow:auto}.person{display:flex;align-items:center;gap:10px;padding:9px;background:var(--panel2);border-radius:9px}.person input{width:auto}.notice{padding:10px;background:#4c3421;color:#ffe0b2;border-radius:9px;font-size:13px}.filelink{color:#a7e9d7}.mobileback{display:none}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{border:0}.main{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.mobileback{display:inline-block}.topbar{padding:12px}.room{padding:15px}.messages{padding:12px}.bubble{max-width:88%}.auth{margin:5vh auto}.tools button{padding:9px}.statusbar{padding:9px}}
</style></head>
<body>
<section id="auth" class="auth">
 <div class="brand"><div class="logo">B</div><div><h1 style="margin:0">BYTECHAT</h1><div class="muted">Your world. Your messages.</div></div></div>
 <div class="stack" id="authform"><h2 id="authtitle">Welcome back</h2><input id="displayName" placeholder="Display name (for new account)" class="hidden" maxlength="40"><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password (10+ characters)" autocomplete="current-password"><button id="authsubmit">Sign in</button><div id="autherror" class="muted"></div></div>
 <div class="authswitch"><span id="switchtext">New to BYTECHAT?</span> <button class="secondary" id="switchauth">Create account</button></div>
</section>
<section id="app" class="app hidden">
 <aside class="sidebar">
  <div class="topbar"><div class="userline"><div id="myavatar" class="avatar">B</div><div><b id="myname">BYTECHAT</b><div id="myusername" class="muted" style="font-size:12px"></div></div></div><div class="tools"><button class="secondary" id="profilebtn" title="Profile">☻</button><button class="secondary" id="groupbtn" title="New group">＋</button><button class="secondary" id="logoutbtn" title="Sign out">↪</button></div></div>
  <div class="statusbar"><button class="pill" id="addstatus">＋ Add status</button><div id="statusitems" style="display:flex;gap:8px"></div></div>
  <div class="search"><input id="searchusers" placeholder="Search people or chats…"></div><div id="rooms" class="rooms"></div>
  <div style="padding:10px 13px;color:var(--muted);font-size:11px">BYTECHAT MVP · use HTTPS in production</div>
 </aside>
 <main class="main">
  <div id="chathead" class="chathead hidden"><div class="userline"><button class="secondary mobileback" id="backbtn">←</button><div id="roomavatar" class="avatar">B</div><div><b id="roomname">Choose a chat</b><div id="roommeta" class="muted" style="font-size:12px"></div></div></div><div class="tools"><button class="secondary" id="voicecall" title="Voice call">☎</button><button class="secondary" id="videocall" title="Video call">▣</button></div></div>
  <div id="messages" class="messages"><div class="empty"><div style="font-size:40px">✉</div><h2>Welcome to BYTECHAT</h2><p>Choose a conversation or find a person to start chatting.</p></div></div>
  <form id="composer" class="composer hidden"><button type="button" class="secondary" id="attachbtn" title="Attach file">＋</button><input type="file" id="fileinput" class="hidden"><input id="messageinput" placeholder="Type a message…" maxlength="4000" autocomplete="off"><button type="submit">Send</button></form>
 </main>
</section>
<div id="modalback" class="modalback hidden"><div class="modal" id="modal"></div></div>
<video id="remoteVideo" autoplay playsinline style="position:fixed;right:12px;bottom:76px;width:min(320px,42vw);max-height:35vh;background:#000;z-index:5;border-radius:12px;display:none"></video>
<video id="localVideo" autoplay muted playsinline style="position:fixed;right:20px;bottom:90px;width:100px;background:#000;z-index:6;border-radius:8px;display:none"></video>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('bc_token'), me=null, socket=null, rooms=[], activeRoom=null, isRegister=false, peer=null, localStream=null, pendingCall=null;
const roomKeyCache=new Map();
const fmt=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=(name,color='#16a085')=>`<div class="avatar" style="background:${esc(color)}">${esc((name||'?').slice(0,1).toUpperCase())}</div>`;
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function showError(el,msg){$(el).textContent=msg}
function modal(title,body,buttons=''){ $('modal').innerHTML=`<h2 style="margin:0">${title}</h2>${body}${buttons}`;$('modalback').classList.remove('hidden')}
function closeModal(){$('modalback').classList.add('hidden')}
$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))closeModal()});
$('switchauth').onclick=()=>{isRegister=!isRegister;$('displayName').classList.toggle('hidden',!isRegister);$('authtitle').textContent=isRegister?'Create your account':'Welcome back';$('authsubmit').textContent=isRegister?'Create account':'Sign in';$('switchtext').textContent=isRegister?'Already have an account?':'New to BYTECHAT?';$('switchauth').textContent=isRegister?'Sign in':'Create account';$('password').autocomplete=isRegister?'new-password':'current-password';showError('autherror','')};
$('authsubmit').onclick=async()=>{try{$('authsubmit').disabled=true;const body={username:$('username').value,password:$('password').value,displayName:$('displayName').value};const d=await fetch('/api/auth/'+(isRegister?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.error);return x});token=d.token;me=d.user;localStorage.setItem('bc_token',token);await startApp()}catch(e){showError('autherror',e.message)}finally{$('authsubmit').disabled=false}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('authsubmit').click()});
$('logoutbtn').onclick=()=>{if(socket)socket.disconnect();localStorage.removeItem('bc_token');token=null;me=null;location.reload()};
async function startApp(){try{if(!me)me=(await api('/api/me')).user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('myname').textContent=me.displayName;$('myusername').textContent='@'+me.username;$('myavatar').style.background=me.avatarColor;$('myavatar').textContent=me.displayName[0].toUpperCase();connectSocket();await loadRooms();await loadStatuses()}catch(e){localStorage.removeItem('bc_token');token=null;$('auth').classList.remove('hidden');$('app').classList.add('hidden');showError('autherror',e.message)}}
function connectSocket(){if(socket)socket.disconnect();socket=io({auth:{token}});socket.on('connect_error',e=>{if(e.message==='unauthorized')logout()});socket.on('message:new',m=>{if(activeRoom&&m.roomId===activeRoom.id)renderMessage(m);else loadRooms()});socket.on('rooms:changed',loadRooms);socket.on('status:changed',loadStatuses);socket.on('app:error',d=>alert(d.message));socket.on('call:signal',handleSignal)}
async function loadRooms(){try{const d=await api('/api/rooms');rooms=d.rooms;renderRooms()}catch(e){console.error(e)}}
function renderRooms(){const q=$('searchusers').value.toLowerCase();const list=rooms.filter(r=>r.name.toLowerCase().includes(q)||r.members.some(m=>m.username.includes(q)));$('rooms').innerHTML=list.map(r=>`<div class="room ${activeRoom?.id===r.id?'active':''}" data-id="${r.id}">${avatar(r.name,r.kind==='group'?'#6c5ce7':'#16a085')}<div class="roominfo"><div class="roomname">${esc(r.name)}</div><div class="preview">${esc(r.lastMessage?.preview|| (r.kind==='group'?'Group chat':'Start a conversation'))}</div></div></div>`).join('')||'<div class="empty">No chats yet.<br>Search for a person above.</div>';document.querySelectorAll('.room').forEach(el=>el.onclick=()=>openRoom(el.dataset.id))}
$('searchusers').addEventListener('input',async()=>{renderRooms();const q=$('searchusers').value.trim();if(q.length<2)return;try{const d=await api('/api/users?q='+encodeURIComponent(q));const found=d.users.filter(u=>!rooms.some(r=>r.kind==='dm'&&r.members.some(m=>m.id===u.id)));$('rooms').innerHTML+=found.map(u=>`<div class="room userresult" data-user="${u.id}">${avatar(u.displayName,u.avatarColor)}<div class="roominfo"><div class="roomname">${esc(u.displayName)}</div><div class="preview">@${esc(u.username)} · Start chat</div></div></div>`).join('');document.querySelectorAll('.userresult').forEach(el=>el.onclick=async()=>{try{const d=await api('/api/rooms/dm',{method:'POST',body:JSON.stringify({userId:el.dataset.user})});await loadRooms();openRoom(d.room.id);$('searchusers').value='';renderRooms()}catch(e){alert(e.message)}})}catch{}});
async function openRoom(id){let r=rooms.find(x=>x.id===id);if(!r){const d=await api('/api/rooms');r=d.rooms.find(x=>x.id===id)}if(!r)return;activeRoom=r;socket.emit('room:join',r.id);$('app').classList.add('chat-open');$('chathead').classList.remove('hidden');$('composer').classList.remove('hidden');$('roomname').textContent=r.name;$('roommeta').textContent=r.kind==='group'?`${r.members.length} members`:r.members.filter(m=>m.id!==me.id).map(m=>'@'+m.username).join(', ');$('roomavatar').textContent=r.name[0].toUpperCase();$('roomavatar').style.background=r.kind==='group'?'#6c5ce7':'#16a085';$('messages').innerHTML='';renderRooms();const d=await api('/api/rooms/'+r.id+'/messages');for(const m of d.messages)renderMessage(m);$('messages').scrollTop=$('messages').scrollHeight}
$('backbtn').onclick=()=>$('app').classList.remove('chat-open');
function renderMessage(m){if(!activeRoom||m.roomId!==activeRoom.id)return;const mine=m.senderId===me.id;let body='';if(m.kind==='text')body=renderTextPayload(m.payload);else if(m.payload.file)body=`<a class="filelink" href="${esc(m.payload.file.url)}" target="_blank" rel="noopener">${esc(m.payload.file.name||'Attachment')} (${Math.ceil((m.payload.file.size||0)/1024)} KB)</a>`;else body=esc(m.payload.text||'Attachment');const div=document.createElement('div');div.className='bubble'+(mine?' mine':'');div.innerHTML=`${!mine?`<div class="byline">${esc(m.displayName||m.username)}</div>`:''}<div>${body}</div><div class="time">${fmt(m.createdAt)}</div>`;$('messages').appendChild(div);$('messages').scrollTop=$('messages').scrollHeight}
function renderTextPayload(p){if(p&&p.ciphertext)return `<span class="muted">🔒 Encrypted message. Enter this chat's shared passphrase to decrypt in a future build.</span>`;return esc(p?.text||'')}
$('composer').onsubmit=async e=>{e.preventDefault();const text=$('messageinput').value.trim();if(!text||!activeRoom)return;$('messageinput').value='';socket.emit('message:send',{roomId:activeRoom.id,kind:'text',payload:{text}})};
$('attachbtn').onclick=()=>$('fileinput').click();
$('fileinput').onchange=async()=>{const file=$('fileinput').files[0];if(!file||!activeRoom)return;try{const fd=new FormData();fd.append('file',file);const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error);socket.emit('message:send',{roomId:activeRoom.id,kind:file.type.startsWith('image/')?'image':'file',payload:{file:d.file}})}catch(e){alert(e.message)}finally{$('fileinput').value=''}};
$('groupbtn').onclick=async()=>{try{const d=await api('/api/users');const users=d.users;modal('Create a group',`<input id="groupname" placeholder="Group name" maxlength="60"><div class="muted">Select members</div><div class="stack">${users.map(u=>`<label class="person">${avatar(u.displayName,u.avatarColor)}<span style="flex:1">${esc(u.displayName)} <span class="muted">@${esc(u.username)}</span></span><input type="checkbox" value="${u.id}"></label>`).join('')||'No other accounts yet'}</div><div id="gerror" class="muted"></div><button id="creategroup">Create group</button><button class="secondary" id="cancelmodal">Cancel</button>`);$('cancelmodal').onclick=closeModal;$('creategroup').onclick=async()=>{try{const userIds=[...document.querySelectorAll('#modal input[type=checkbox]:checked')].map(x=>x.value);const d=await api('/api/rooms/group',{method:'POST',body:JSON.stringify({name:$('groupname').value,userIds})});closeModal();await loadRooms();openRoom(d.room.id)}catch(e){showError('gerror',e.message)}}}catch(e){alert(e.message)}};
$('profilebtn').onclick=()=>{modal('Your profile',`<label>Display name<input id="pname" maxlength="40" value="${esc(me.displayName)}"></label><label>Bio<input id="pbio" maxlength="160" value="${esc(me.bio||'')}"></label><div id="perror" class="muted"></div><button id="saveprofile">Save profile</button><button class="secondary" id="cancelmodal">Cancel</button>`);$('cancelmodal').onclick=closeModal;$('saveprofile').onclick=async()=>{try{const d=await api('/api/me',{method:'PATCH',body:JSON.stringify({displayName:$('pname').value,bio:$('pbio').value})});me=d.user;$('myname').textContent=me.displayName;closeModal()}catch(e){showError('perror',e.message)}}};
$('addstatus').onclick=()=>{modal('Add a status',`<textarea id="statusinput" rows="4" maxlength="500" placeholder="What’s happening? (visible to signed-in BYTECHAT users)"></textarea><div id="serror" class="muted"></div><button id="poststatus">Post status · 24h</button><button class="secondary" id="cancelmodal">Cancel</button>`);$('cancelmodal').onclick=closeModal;$('poststatus').onclick=async()=>{try{await api('/api/status',{method:'POST',body:JSON.stringify({text:$('statusinput').value})});closeModal();loadStatuses()}catch(e){showError('serror',e.message)}}};
async function loadStatuses(){try{const d=await api('/api/status');$('statusitems').innerHTML=d.statuses.slice(0,12).map(s=>`<button class="pill statusitem" data-status="${s.id}">${avatar(s.displayName,s.avatarColor).replace('class="avatar"','class="avatar" style="margin:auto;width:30px;height:30px;background:'+esc(s.avatarColor)+'"')}<div>${esc(s.displayName)}</div></button>`).join('');document.querySelectorAll('[data-status]').forEach(el=>el.onclick=()=>{const s=d.statuses.find(x=>x.id===el.dataset.status);modal(esc(s.displayName)+' · status',`<p style="white-space:pre-wrap">${esc(s.text)}</p><div class="muted">${new Date(s.createdAt).toLocaleString()}</div><button id="closeStatus">Close</button>`);$('closeStatus').onclick=closeModal})}catch{}}

// WebRTC calls: direct one-to-one signaling; production deployment needs TURN for reliable connectivity.
async function startCall(video){if(!activeRoom||activeRoom.kind!=='dm')return alert('Calls are currently supported in direct chats only.');const other=activeRoom.members.find(m=>m.id!==me.id);if(!other)return;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video});$('localVideo').srcObject=localStream;$('localVideo').style.display=video?'block':'none';peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));peer.ontrack=e=>{$('remoteVideo').srcObject=e.streams[0];$('remoteVideo').style.display='block'};peer.onicecandidate=e=>{if(e.candidate)socket.emit('call:signal',{targetId:other.id,roomId:activeRoom.id,signal:{type:'candidate',candidate:e.candidate}})};const offer=await peer.createOffer();await peer.setLocalDescription(offer);socket.emit('call:signal',{targetId:other.id,roomId:activeRoom.id,signal:{type:'offer',sdp:offer,video}});modal('Calling '+esc(other.displayName),'<p>Waiting for the other person to answer…</p><button id="endcall">End call</button>');$('endcall').onclick=endCall}catch(e){alert('Could not start call: '+e.message);endCall()}}
async function handleSignal(d){try{if(d.signal.type==='offer'){pendingCall=d;modal('Incoming call',`<p>${esc(d.fromName)} is calling you.</p><button id="answercall">Answer</button><button class="secondary" id="declinecall">Decline</button>`);$('declinecall').onclick=()=>{closeModal();pendingCall=null};$('answercall').onclick=async()=>{closeModal();await answerCall(d)}}else if(!peer)return;else if(d.signal.type==='answer'){await peer.setRemoteDescription(new RTCSessionDescription(d.signal.sdp));closeModal();modal('Call connected','<p>Call is active. Your media is peer-to-peer.</p><button id="endcall">End call</button>');$('endcall').onclick=endCall}else if(d.signal.type==='candidate'){await peer.addIceCandidate(new RTCIceCandidate(d.signal.candidate))}}catch(e){console.error(e);alert('Call signaling failed: '+e.message)}}
async function answerCall(d){const r=rooms.find(x=>x.id===d.roomId);if(!r)return alert('Chat not found');activeRoom=r;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!d.signal.video});$('localVideo').srcObject=localStream;$('localVideo').style.display=d.signal.video?'block':'none';peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));peer.ontrack=e=>{$('remoteVideo').srcObject=e.streams[0];$('remoteVideo').style.display='block'};peer.onicecandidate=e=>{if(e.candidate)socket.emit('call:signal',{targetId:d.fromId,roomId:d.roomId,signal:{type:'candidate',candidate:e.candidate}})};await peer.setRemoteDescription(new RTCSessionDescription(d.signal.sdp));const answer=await peer.createAnswer();await peer.setLocalDescription(answer);socket.emit('call:signal',{targetId:d.fromId,roomId:d.roomId,signal:{type:'answer',sdp:answer}});modal('Call connected','<p>Call is active. Your media is peer-to-peer.</p><button id="endcall">End call</button>');$('endcall').onclick=endCall}catch(e){alert('Could not answer: '+e.message);endCall()}}
function endCall(){if(peer){peer.close();peer=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$('localVideo').style.display='none';$('remoteVideo').style.display='none';$('remoteVideo').srcObject=null;closeModal()}
$('voicecall').onclick=()=>startCall(false);$('videocall').onclick=()=>startCall(true);
function logout(){localStorage.removeItem('bc_token');location.reload()}
if(token)startApp();
</script></body></html>
